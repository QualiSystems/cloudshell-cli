# tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist =
    py39-{master,dev}
    pre-commit
    build
distshare = dist

[testenv]
skip_install:
    dev: true
deps =
    master: -r test_requirements.txt
    dev: -r dev_requirements.txt
commands =
    pytest --cov=cloudshell.cli tests --cov-report=xml

[testenv:pre-commit]
basepython = python3.9
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure

[testenv:build]
skip_install = true
deps = build
commands = python -m build -w

[isort]
profile = black
forced_separate = cloudshell.cli,tests

[flake8]
max-line-length = 88
exclude = cloudshell/cli/session/_telnetlib.py
;we don't need have docstrings in every func, class and package
;and W503 is not PEP 8 compliant
ignore = D100,D101,D102,D103,D104,D105,D106,D107,D401,W503,E203
per-file-ignores =
;E231/E702 are false positives inside f-strings on Python >= 3.12 tokenizer
    cloudshell/cli/session/tl1_session.py:E231,E702
;module intentionally named types since 5.0
    cloudshell/cli/types.py:A005

[coverage:report]
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING
omit =
    *__init__*
